name: 盤中自動掃描

on:
  schedule:
    # 每10分鐘 UTC 1:00-5:30 (= 台北 9:00-13:30) 週一到週五
    - cron: '*/10 1-5 * * 1-5'
    - cron: '0,10,20,30 6 * * 1-5'  # UTC 6:00-6:30 = 台北 14:00-14:30 收盤前
  workflow_dispatch:  # 手動觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan endpoint
        env:
          SCAN_URL: ${{ secrets.SCAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SCAN_URL}/api/cron/scan"
