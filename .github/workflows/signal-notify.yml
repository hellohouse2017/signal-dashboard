name: Signal Check & TG Notify

on:
  schedule:
    # 每天 22:00 UTC = 台灣 06:00 AM（美股收盤後）
    # UTC 週日~四 = 台灣時間週一~五
    - cron: '0 22 * * 0-4'
  workflow_dispatch:  # 可手動觸發

jobs:
  signal-check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signal data from Dashboard
        id: signal
        run: |
          RESPONSE=$(curl -sf "https://signal-dashboard-ashy.vercel.app/api/signal" || echo "FAILED")
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "status=error" >> $GITHUB_OUTPUT
          else
            echo "data=$RESPONSE" >> $GITHUB_OUTPUT
            echo "status=ok" >> $GITHUB_OUTPUT
          fi

      - name: Parse signal and send TG notification
        if: steps.signal.outputs.status == 'ok'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          DATA='${{ steps.signal.outputs.data }}'

          SCORE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['score'])")
          PRICE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['price'])")
          DATE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['date'])")

          # 災難出場條件（核心策略）
          CAT_STATUS=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('catastrophe',{}).get('status','normal'))")
          EXIT_SCORE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('catastrophe',{}).get('exit_score',0))")
          ENTRY_SCORE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('catastrophe',{}).get('entry_score',0))")

          echo "Catastrophe status: $CAT_STATUS (exit: $EXIT_SCORE/5, entry: $ENTRY_SCORE/4)"

          case "$CAT_STATUS" in
            "exit_triggered")
              MSG="🚨🚨🚨 災難出場觸發！立即賣出！
          🛡️ 出場條件：${EXIT_SCORE}/5（≥3 觸發）
          📈 0050：${PRICE} 元
          🎯 評分：${SCORE}
          📅 日期：${DATE}

          👉 全部賣出 0050/00631L，持有現金
          👉 等待安全進場信號（4取3）再買回
          ⚠️ 冷卻期 5 天"
              ;;
            "exit_warning")
              MSG="⚠️ 出場預警！密切注意
          🛡️ 出場條件：${EXIT_SCORE}/5（接近觸發）
          📈 0050：${PRICE} 元
          🎯 評分：${SCORE}
          📅 日期：${DATE}

          👉 繼續持有，但明天務必再檢查
          💡 再多 1 個條件就觸發出場"
              ;;
            "entry_safe")
              MSG="✅ 安全進場！加碼買入
          🟢 進場條件：${ENTRY_SCORE}/4（≥3 觸發）
          📈 0050：${PRICE} 元
          🎯 評分：${SCORE}
          📅 日期：${DATE}

          👉 恐慌基金拿 20 萬，開盤買入 0050/00631L
          💡 市場已安全，回場 + 加碼"
              ;;
            *)
              MSG="😎 每日信號：正常持有
          📈 0050：${PRICE} 元｜評分：${SCORE}
          🛡️ 出場 ${EXIT_SCORE}/5 進場 ${ENTRY_SCORE}/4
          📅 ${DATE}
          ✅ 不需操作"
              ;;
          esac

          # 發送 TG
          curl -sf "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}"
          echo "TG notification sent!"

      - name: Send error notification
        if: steps.signal.outputs.status == 'error'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -sf "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=❌ Dashboard 信號檢查失敗！請手動查看"
