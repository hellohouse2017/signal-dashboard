name: Signal Check & TG Notify

on:
  schedule:
    # 每天 22:00 UTC = 台灣 06:00 AM（美股收盤後）
    # UTC 週日~四 = 台灣時間週一~五
    - cron: '0 22 * * 0-4'
  workflow_dispatch:  # 可手動觸發

jobs:
  signal-check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signal data from Dashboard
        id: signal
        run: |
          RESPONSE=$(curl -sf "https://signal-dashboard-ashy.vercel.app/api/signal" || echo "FAILED")
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "status=error" >> $GITHUB_OUTPUT
          else
            echo "data=$RESPONSE" >> $GITHUB_OUTPUT
            echo "status=ok" >> $GITHUB_OUTPUT
          fi

      - name: Parse signal and send TG notification
        if: steps.signal.outputs.status == 'ok'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          DATA='${{ steps.signal.outputs.data }}'

          CUR=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['signal'])")
          PREV=$(echo "$DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('prev_signal',d['signal']))")
          SCORE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['score'])")
          PRICE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['price'])")
          DATE=$(echo "$DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['date'])")

          TRANSITION="${PREV}→${CUR}"
          echo "Signal transition: $TRANSITION"

          # 決定訊息
          case "$TRANSITION" in
            "LONG→SHORT")
              MSG="🚨🚨🚨 重大恐慌！立即加碼！

📊 信號：${TRANSITION}
📈 0050：${PRICE} 元
🎯 評分：${SCORE}
📅 日期：${DATE}

👉 恐慌基金拿 50 萬，開盤市價買 00631L
💡 市場從做多→避險，歷史回測最佳買入時機"
              ;;
            "HOLD→SHORT")
              MSG="⚠️ 小幅加碼信號

📊 信號：${TRANSITION}
📈 0050：${PRICE} 元
🎯 評分：${SCORE}
📅 日期：${DATE}

👉 恐慌基金拿 1 萬，買 00631L
💡 市場從觀望→避險，小額佈局"
              ;;
            "SHORT→LONG")
              MSG="🎉 恐慌結束！

📊 信號：${TRANSITION}
📈 0050：${PRICE} 元
🎯 評分：${SCORE}

👉 不賣出，繼續持有享受反彈"
              ;;
            "SHORT→HOLD")
              MSG="🟡 市場回穩中

📊 信號：${TRANSITION}
📈 0050：${PRICE} 元
🎯 評分：${SCORE}

👉 不動作，繼續觀察"
              ;;
            *)
              EMOJI="⚪"
              if [ "$CUR" = "LONG" ]; then EMOJI="🟢"; fi
              if [ "$CUR" = "HOLD" ]; then EMOJI="🟡"; fi
              if [ "$CUR" = "SHORT" ]; then EMOJI="🔴"; fi
              MSG="${EMOJI} 每日信號：${CUR}
📈 0050：${PRICE} 元｜評分：${SCORE}
😎 今日不需操作"
              ;;
          esac

          # 發送 TG
          curl -sf "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}"
          echo "TG notification sent!"

      - name: Send error notification
        if: steps.signal.outputs.status == 'error'
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -sf "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=❌ Dashboard 信號檢查失敗！請手動查看"
