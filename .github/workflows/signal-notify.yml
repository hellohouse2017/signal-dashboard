name: Signal Check & TG Notify

on:
  schedule:
    # 每天 22:00 UTC = 台灣 06:00 AM（美股收盤後），週一到週五
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # 可手動觸發

jobs:
  signal-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check signal and send TG notification
        run: |
          echo "Calling signal check endpoint..."
          RESPONSE=$(curl -sf "https://signal-dashboard-ashy.vercel.app/api/cron/signal-check" || echo "FAILED")
          echo "Response: $RESPONSE"
          if [ "$RESPONSE" = "FAILED" ]; then
            echo "Endpoint failed, sending error notification..."
            curl -sf "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
              -d "text=❌ Dashboard signal check failed!" || true
          fi
